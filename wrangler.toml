# Cloudflare Workers static assets: `npm run deploy` builds and uploads dist/ as the "lio" project.
name = "lio"
compatibility_date = "2026-10-01"

# Served at https://lio.oli.zone (Cloudflare creates the DNS record and certificate).
routes = [{ pattern = "lio.oli.zone", custom_domain = true }]
# Only the custom domain is public: no workers.dev address or preview URLs.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
